name: Update QB Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 2,5'

permissions:
  contents: write

jobs:
  update-qb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Generate QB statistics
        run: python build_qb_stats.py

      - name: Commit updated QB data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qb_weekly_stats.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update QB weekly statistics"
            git push
          fi
